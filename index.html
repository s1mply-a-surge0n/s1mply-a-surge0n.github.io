<!DOCTYPE html>

<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Sơ đồ chỗ ngồi</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        #f5f6fa;

      color:
        #202124;

    }


    .container {

      max-width: 1400px;

      margin:
        auto;

      padding:
        40px 20px 80px;

    }


    header {

      text-align:
        center;

      margin-bottom:
        35px;

    }


    h1 {

      margin:
        0 0 10px;

      font-size:
        32px;

    }


    .subtitle {

      color:
        #777;

      margin:
        0;

    }


    .toolbar {

      display:
        flex;

      justify-content:
        center;

      gap:
        10px;

      margin:
        25px 0;

      flex-wrap:
        wrap;

    }


    button {

      border:
        none;

      border-radius:
        8px;

      padding:
        10px 16px;

      cursor:
        pointer;

      font-size:
        14px;

    }


    .btn-primary {

      background:
        #2563eb;

      color:
        white;

    }


    .btn-secondary {

      background:
        white;

      border:
        1px solid #ddd;

    }


    .sections {

      display:
        flex;

      flex-wrap:
        wrap;

      justify-content:
        center;

      align-items:
        flex-start;

      gap:
        25px;

    }


    .section {

      background:
        white;

      border-radius:
        16px;

      padding:
        20px;

      box-shadow:
        0 5px 20px
        rgba(0,0,0,.06);

    }


    .section-title {

      text-align:
        center;

      font-weight:
        700;

      margin-bottom:
        18px;

      font-size:
        18px;

    }


    .seat-grid {

      display:
        grid;

      gap:
        8px;

    }


    .seat {

      width:
        70px;

      height:
        70px;

      border-radius:
        10px;

      display:
        flex;

      flex-direction:
        column;

      justify-content:
        center;

      align-items:
        center;

      cursor:
        pointer;

      border:
        2px solid transparent;

      transition:
        .15s;

      overflow:
        hidden;

    }


    .seat:hover {

      transform:
        translateY(-2px);

    }


    .available {

      background:
        #e8f5e9;

      border-color:
        #a5d6a7;

      color:
        #2e7d32;

    }


    .occupied {

      background:
        #ffebee;

      border-color:
        #ef9a9a;

      color:
        #c62828;

    }


    .seat-number {

      font-weight:
        700;

      font-size:
        14px;

    }


    .seat-name {

      font-size:
        10px;

      margin-top:
        4px;

      max-width:
        60px;

      overflow:
        hidden;

      text-overflow:
        ellipsis;

      white-space:
        nowrap;

    }


    .status {

      max-width:
        600px;

      margin:
        0 auto 20px;

      padding:
        12px 16px;

      border-radius:
        8px;

      text-align:
        center;

      display:
        none;

    }


    .status.show {

      display:
        block;

    }


    .status.info {

      background:
        #e7f1ff;

      color:
        #175cd3;

    }


    .status.success {

      background:
        #e8f5e9;

      color:
        #2e7d32;

    }


    .status.error {

      background:
        #ffebee;

      color:
        #c62828;

    }


    .legend {

      display:
        flex;

      justify-content:
        center;

      gap:
        20px;

      margin-bottom:
        20px;

    }


    .legend-item {

      display:
        flex;

      align-items:
        center;

      gap:
        6px;

      font-size:
        14px;

    }


    .legend-box {

      width:
        16px;

      height:
        16px;

      border-radius:
        4px;

    }


    .green {

      background:
        #e8f5e9;

      border:
        1px solid #a5d6a7;

    }


    .red {

      background:
        #ffebee;

      border:
        1px solid #ef9a9a;

    }


    /* ==========================================
       ADMIN
       ========================================== */

    .modal {

      position:
        fixed;

      inset:
        0;

      background:
        rgba(0,0,0,.45);

      display:
        none;

      justify-content:
        center;

      align-items:
        center;

      z-index:
        1000;

      padding:
        20px;

    }


    .modal.show {

      display:
        flex;

    }


    .modal-box {

      width:
        min(900px, 100%);

      max-height:
        90vh;

      overflow:
        auto;

      background:
        white;

      border-radius:
        16px;

      padding:
        25px;

    }


    .modal-box.small {

      width:
        min(400px, 100%);

    }


    .modal-header {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      margin-bottom:
        20px;

    }


    .modal-header h2 {

      margin:
        0;

    }


    .close {

      background:
        none;

      font-size:
        24px;

    }


    .admin-section {

      border:
        1px solid #ddd;

      border-radius:
        10px;

      padding:
        15px;

      margin-bottom:
        15px;

    }


    .admin-section-header {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      margin-bottom:
        12px;

    }


    .admin-section-header strong {

      font-size:
        16px;

    }


    .admin-grid {

      display:
        grid;

      grid-template-columns:
        repeat(auto-fill, minmax(60px, 1fr));

      gap:
        6px;

    }


    .admin-seat {

      padding:
        8px 4px;

      border:
        1px solid #ddd;

      border-radius:
        6px;

      background:
        white;

      cursor:
        pointer;

      text-align:
        center;

      font-size:
        12px;

    }


    .admin-seat.disabled {

      opacity:
        .4;

      text-decoration:
        line-through;

    }


    .form-row {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        10px;

      margin-bottom:
        10px;

    }


    input {

      width:
        100%;

      padding:
        10px 12px;

      border:
        1px solid #ddd;

      border-radius:
        8px;

      font-size:
        14px;

    }


    .admin-actions {

      display:
        flex;

      justify-content:
        flex-end;

      gap:
        10px;

      margin-top:
        20px;

    }


    @media(max-width:600px) {

      .seat {

        width:
          55px;

        height:
          55px;

      }


      .form-row {

        grid-template-columns:
          1fr;

      }

    }

  </style>

</head>


<body>


<div class="container">


  <header>

    <h1>
      SƠ ĐỒ CHỌN CHỖ NGỒI
    </h1>

    <p class="subtitle">
      Vui lòng chọn ghế và nhập tên của bạn
    </p>

  </header>


  <div
    id="status"
    class="status"
  ></div>


  <div class="legend">

    <div class="legend-item">

      <span class="legend-box green"></span>

      Ghế trống

    </div>


    <div class="legend-item">

      <span class="legend-box red"></span>

      Đã có người

    </div>

  </div>


  <div class="toolbar">

    <button
      class="btn-secondary"
      onclick="loadData()"
    >
      🔄 Tải lại
    </button>


    <button
      class="btn-primary"
      onclick="openAdminLogin()"
    >
      ⚙️ Admin
    </button>

  </div>


  <div
    id="sections"
    class="sections"
  ></div>


</div>



<!-- =============================================
     ADMIN LOGIN
     ============================================= -->

<div
  id="loginModal"
  class="modal"
>

  <div class="modal-box small">

    <div class="modal-header">

      <h2>Admin</h2>

      <button
        class="close"
        onclick="closeAdminLogin()"
      >
        ×
      </button>

    </div>


    <input
      id="adminPassword"
      type="password"
      placeholder="Mật khẩu admin"
    >


    <div class="admin-actions">

      <button
        class="btn-secondary"
        onclick="closeAdminLogin()"
      >
        Hủy
      </button>


      <button
        class="btn-primary"
        onclick="loginAdmin()"
      >
        Đăng nhập
      </button>

    </div>

  </div>

</div>



<!-- =============================================
     ADMIN PANEL
     ============================================= -->

<div
  id="adminModal"
  class="modal"
>

  <div class="modal-box">

    <div class="modal-header">

      <h2>
        ⚙️ Quản lý sơ đồ
      </h2>

      <button
        class="close"
        onclick="closeAdminPanel()"
      >
        ×
      </button>

    </div>


    <div id="adminSections"></div>


    <div class="admin-actions">

      <button
        class="btn-secondary"
        onclick="closeAdminPanel()"
      >
        Hủy
      </button>


      <button
        class="btn-primary"
        onclick="saveAdminConfig()"
      >
        💾 Lưu cấu trúc
      </button>

    </div>

  </div>

</div>



<script src="app.js"></script>

</body>

</html>
