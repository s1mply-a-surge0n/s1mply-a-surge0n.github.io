<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>H.E.I. Seat Map</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body>

<div class="container-fluid px-4 py-4">

  <div class="d-flex justify-content-between align-items-center mb-3">

    <div>

      <h2 class="header-title mb-1">
        SƠ ĐỒ CHỌN CHỖ
      </h2>

      <div class="text-muted">
        Chọn ghế để đăng ký chỗ ngồi
      </div>

    </div>

    <div>

      <button
        class="btn btn-outline-secondary me-2"
        onclick="loadData()"
      >
        🔄
      </button>

      <button
        class="btn btn-dark"
        onclick="openAdminLogin()"
      >
        ⚙️ Admin
      </button>

    </div>

  </div>


  <!-- STATUS -->

  <div
    id="statusMsg"
    class="alert text-center d-none"
  ></div>


  <!-- LEGEND -->

  <div class="text-center mb-4">

    <span class="legend available-legend"></span>
    Ghế trống

    <span class="legend occupied-legend ms-4"></span>
    Đã có người

  </div>


  <!-- SEAT MAP -->

  <div
    id="sectionsContainer"
    class="sections-wrapper"
  ></div>


</div>


<!-- =====================================================
     ADMIN LOGIN
===================================================== -->

<div
  class="modal fade"
  id="adminLoginModal"
  tabindex="-1"
>

  <div class="modal-dialog modal-dialog-centered">

    <div class="modal-content">

      <div class="modal-header">

        <h5 class="modal-title">
          🔐 Admin
        </h5>

        <button
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>

      </div>

      <div class="modal-body">

        <label class="form-label">
          Mật khẩu quản trị
        </label>

        <input
          type="password"
          id="adminPassword"
          class="form-control"
          placeholder="Nhập mật khẩu"
        >

      </div>

      <div class="modal-footer">

        <button
          class="btn btn-secondary"
          data-bs-dismiss="modal"
        >
          Hủy
        </button>

        <button
          class="btn btn-dark"
          onclick="loginAdmin()"
        >
          Đăng nhập
        </button>

      </div>

    </div>

  </div>

</div>


<!-- =====================================================
     ADMIN MODAL
===================================================== -->

<div
  class="modal fade"
  id="adminModal"
  tabindex="-1"
>

  <div class="modal-dialog modal-xl modal-dialog-scrollable">

    <div class="modal-content">

      <div class="modal-header">

        <h5 class="modal-title">
          ⚙️ Quản lý sơ đồ
        </h5>

        <button
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>

      </div>


      <div class="modal-body">

        <div class="row">

          <!-- LEFT -->

          <div class="col-md-4">

            <div class="d-flex justify-content-between mb-3">

              <strong>
                Khu vực
              </strong>

              <button
                class="btn btn-sm btn-primary"
                onclick="addSection()"
              >
                + Khu vực
              </button>

            </div>

            <div id="adminSections"></div>

          </div>


          <!-- RIGHT -->

          <div class="col-md-8">

            <div id="sectionEditor"></div>

          </div>

        </div>

      </div>


      <div class="modal-footer">

        <button
          class="btn btn-secondary"
          data-bs-dismiss="modal"
        >
          Hủy
        </button>

        <button
          class="btn btn-primary"
          onclick="saveLayout()"
        >
          💾 Lưu cấu trúc
        </button>

      </div>

    </div>

  </div>

</div>


<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
></script>

<script src="app.js"></script>

</body>

</html>
